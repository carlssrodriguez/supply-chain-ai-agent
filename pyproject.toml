[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-ai-agent"
version = "0.1.0"
description = "An educational agentic AI application for supply chain workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastembed>=0.7,<1",
    "fastapi>=0.115,<1",
    "faiss-cpu>=1.14,<2",
    "groq>=0.30,<2",
    "numpy>=1.26,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "anyio>=4,<4.15",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
